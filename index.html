<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Min Personlige App 1.4.26</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#193047;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:18px}header{background:#e4f1ec;border-radius:18px;padding:20px;margin-bottom:16px}h1{margin:0 0 6px;font-size:clamp(23px,4vw,32px)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,.btn{border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer;background:#dfe9ec;color:#193047}button.primary,nav button.active{background:#176b58;color:white}.card{background:white;border:1px solid #d9e3e7;border-radius:16px;padding:18px;margin:12px 0}.muted{color:#60747e}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf1f2}.item:last-child{border-bottom:0}.item .grow{flex:1}.item input[type=checkbox]{width:23px;height:23px;accent-color:#176b58}input,select,textarea{color-scheme:light;color:#193047;font:inherit;padding:12px;border:1px solid #afc1c7;border-radius:9px;width:100%;background:white}select option{color:#193047!important;background:#ffffff!important}select{color:#193047!important;background:#ffffff!important}label{display:block;margin:12px 0 5px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.small{font-size:13px}.tag{font-size:12px;color:#526f76}.overdue{background:#fff8e9;border-left:4px solid #c58a29}.done{text-decoration:line-through;color:#819094}a{color:#176b58;overflow-wrap:anywhere}.hidden{display:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.shell{padding:10px}.card{padding:14px}nav button{flex:1 1 42%}}
.date-row{display:flex;align-items:stretch;gap:8px}.date-row>input[type=text]{flex:1;min-width:0}.calendar-trigger{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 52px;background:#dfe9ec;border-radius:10px;font-size:25px;cursor:pointer}.calendar-trigger input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0}.calendar-trigger:focus-within{outline:2px solid #176b58;outline-offset:2px}
/* Alle aktiviteter i én lodret kolonne */
.item{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.item .grow{width:100%;min-width:0}
.item input[type=checkbox]{align-self:flex-start}
.item button{align-self:flex-start}
.delete-panel{background:#fff7ed;border:1px solid #d5a46d;border-radius:12px;padding:14px;margin:10px 0;color:#193047}
.delete-panel .actions{display:flex;flex-wrap:wrap;gap:8px}
.delete-panel button{width:auto}
.link-item{padding:14px 4px;gap:8px}
.link-item .link-title{font-size:19px;font-weight:750;color:#12604f;text-decoration:underline;text-underline-offset:3px}
.link-item .link-address{font-size:12px;color:#60747e;margin-top:4px;overflow-wrap:anywhere}
.link-buttons{display:flex;gap:7px;flex-wrap:wrap}
.link-buttons button{font-size:13px;padding:6px 10px;border-radius:7px;align-self:auto}
.link-buttons button:last-child{background:#f8e8e6;color:#8b3027}
/* Linkknapper i højre side af samme række, også på mobil */
.link-item{display:flex;flex-direction:row;align-items:center;gap:12px}
.link-item .grow{flex:1 1 auto;width:auto;min-width:0}
.link-item .link-buttons{display:flex;flex:0 0 auto;flex-wrap:nowrap;align-items:center;justify-content:flex-end;margin-left:auto}
.link-item .link-buttons button{white-space:nowrap;font-size:12px;padding:6px 8px}
@media(max-width:420px){.link-item{gap:5px}.link-item .link-title{font-size:16px}.link-item .link-buttons{gap:4px}.link-item .link-buttons button{font-size:11px;padding:5px 6px}}

/* Version 1.4.15 – todelt overblik under Min dag */
.day-top-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr);gap:14px;align-items:stretch}
.day-top-grid>.card{margin:12px 0;min-width:0}
.day-top-grid h2{background:#e0f2db;border-radius:10px;padding:12px 15px;margin:0 0 18px;color:#193047}
.day-date-card .date-row{max-width:100%}
.quick-links{display:flex;flex-direction:column}
.quick-link{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid #d4e1e5;color:#176b35!important;font-size:18px;font-weight:700;text-decoration:none}
.quick-link:hover{text-decoration:underline;background:#f2f9f0}
.quick-link:last-child{border-bottom:0}
/* Version 1.4.15 – kompakt, selvstændigt rullefelt til hurtige links */
.day-links-card{min-width:0}
.day-links-card .quick-links{max-height:220px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#9bb9b2 #f2f7f5;padding-right:5px}
.day-links-card .quick-link{min-height:30px;padding:5px 7px;gap:7px;font-size:15px;line-height:1.3;border-bottom:1px solid #e5eded;overflow-wrap:anywhere}
.day-links-card .quick-link span:last-child{min-width:0}
.day-links-card h2{margin-bottom:8px}
@media(max-width:750px){.day-top-grid{grid-template-columns:1fr}}

/* Kompakt ændringsoversigt, kun udviklervisningen */
.history-compact{font-size:12px;line-height:1.15}
.history-compact .card{padding:8px 10px;margin:5px 0;border-radius:8px}
.history-compact h2{font-size:14px;line-height:1.15;margin:0 0 3px}
.history-compact h3{font-size:13px;line-height:1.15;margin:0 0 4px}
.history-compact p{font-size:12px;line-height:1.15;margin:1px 0}
.history-compact .item{display:flex;flex-direction:row;align-items:baseline;gap:7px;padding:3px 0;line-height:1.15}
.history-compact .item>div{min-width:0}
.history-compact strong{font-size:12px;font-weight:650}
.history-compact .tag{font-size:12px;white-space:nowrap}

.home-controls{display:flex;justify-content:flex-end;margin:4px 0 0}.home-controls button{font-size:13px;padding:8px 12px}.home-settings{background:#f4faf7}.home-settings h3{margin:0 0 8px}.home-choice{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #dfe9e3;font-weight:500;cursor:pointer}.home-choice input{width:20px;height:20px;accent-color:#176b58;flex:0 0 auto}.home-choice button{min-width:70px;font-size:13px;padding:7px 10px}.home-mini-date{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:white;border:1px solid #d9e3e7;padding:10px;border-radius:12px;margin-top:10px}.home-mini-date button{padding:7px 12px}
.day-top-grid [hidden], [data-home-section][hidden]{display:none!important}.speech-icons{display:flex;align-items:center;gap:8px;margin:-6px 0 14px}.speech-icons button{padding:7px 12px;font-size:20px;min-width:46px}</style></head><body><div class="shell"><header><h1>Min Personlige App</h1><div class="muted">Mit overblik – enkelt og overskueligt</div><div style="margin-top:12px"><button id="developerToggle" type="button" onclick="toggleDeveloperMode()" style="font-size:13px;padding:7px 11px">Vis udviklerværktøjer</button></div></header><nav id="nav"></nav><main id="main"></main><p class="muted small">Version 1.4.33 · Testudgave · Data gemmes lokalt, når browseren tillader det. Overførsel mellem separate forhåndsvisninger er ikke garanteret. Brug ikke følsomme oplysninger endnu.</p></div><script>
const KEY='minpersonligeapp_v1';const starter={tasks:[{id:'t1',name:'Købe ind',date:today(),time:'',repeat:'once',done:{}},{id:'t2',name:'Gå en tur',date:today(),time:'13:00',repeat:'daily',done:{}}],links:[{id:'l1',name:'DR',url:'https://www.dr.dk'},{id:'l2',name:'Rejseplanen',url:'https://www.rejseplanen.dk'}]};function displayDate(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return iso||'';const [y,m,d]=iso.split('-');return `${d}-${m}-${y}`}function parseDate(value){const m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(value.trim());if(!m)return null;const [,d,mo,y]=m;const x=new Date(Number(y),Number(mo)-1,Number(d));return x.getFullYear()===Number(y)&&x.getMonth()+1===Number(mo)&&x.getDate()===Number(d)?`${y}-${mo}-${d}`:null}function today(){return localDate(new Date())}function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}let state,initialStorageStatus='';
try{
 const raw=localStorage.getItem(KEY);
 state=raw?JSON.parse(raw):structuredClone(starter);
 if(!state||typeof state!=='object'||!Array.isArray(state.tasks)||!Array.isArray(state.links))throw Error('Ugyldige data');
 const probe='minpersonligeapp_probe';localStorage.setItem(probe,'ok');
 if(localStorage.getItem(probe)!=='ok')throw Error('Lageret kan ikke læses tilbage');
 localStorage.removeItem(probe);
 initialStorageStatus=raw?'Tidligere gemte oplysninger blev indlæst automatisk.':'Lokalt lager er tilgængeligt. Nye oplysninger kan gemmes her.';
}catch(e){state=structuredClone(starter);initialStorageStatus='Advarsel: Oplysninger kan muligvis ikke gemmes eller indlæses i denne forhåndsvisning.'}
state.tasks??=[];state.links??=[];const defaultHome={date:true,links:true,activities:true,overdue:true};state.home={...defaultHome,...(state.home&&typeof state.home==='object'?state.home:{})};let developerMode=false;let homeSettingsOpen=false;let page='day',viewDate=today(),editing=null,saveNotice='',pendingDelete=null;let lastOpenDate=today();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let storageAvailable=true;const save=()=>{try{const serialized=JSON.stringify(state);localStorage.setItem(KEY,serialized);if(localStorage.getItem(KEY)!==serialized)throw Error('Kontrol af lagring mislykkedes');storageAvailable=true;return true}catch(e){storageAvailable=false;return false}};const uid=()=>String(Date.now())+Math.random().toString(36).slice(2);const dt=s=>new Date(s+'T12:00:00');function active(t,date){if(date<t.date)return false;if(t.skipped&&t.skipped[date])return false;if(t.repeat==='once')return t.date===date;if(t.repeat==='daily')return true;if(t.repeat==='every2days')return Math.round((dt(date)-dt(t.date))/86400000)%2===0;if(t.repeat==='every2weeks')return Math.round((dt(date)-dt(t.date))/86400000)%14===0;if(t.repeat==='every2months'){const start=dt(t.date),current=dt(date);return current.getDate()===start.getDate()&&((current.getFullYear()-start.getFullYear())*12+current.getMonth()-start.getMonth())%2===0}if(t.repeat==='weekly')return dt(date).getDay()===dt(t.date).getDay();if(t.repeat==='monthly')return dt(date).getDate()===dt(t.date).getDate();if(t.repeat==='yearly')return date.slice(5)===t.date.slice(5);return false}function outstanding(t,date){if(t.repeat!=='once'||t.date>=date||t.done[t.date])return false;return true}function toggleDeveloperMode(){developerMode=!developerMode;if(!developerMode&&(page==='backup'||page==='history'))page='day';editing=null;render()}function tab(p){cancelVoiceTask();homeSettingsOpen=false;if(!developerMode&&(p==='backup'||p==='history'))return;page=p;editing=null;pendingDelete=null;render()}function render(){const names=[['day','Min dag'],['tasks','Mine opgaver'],['routines','Mine rutiner'],['links','Mine links']];if(developerMode)names.push(['backup','Sikkerhedskopi'],['history','Ændringsoversigt']);document.getElementById('developerToggle').textContent=developerMode?'Skjul udviklerværktøjer':'Vis udviklerværktøjer';document.getElementById('nav').innerHTML=names.map(([p,n])=>`<button class="${page===p?'active':''}" onclick="tab('${p}')">${n}</button>`).join('');document.getElementById('main').innerHTML=(page==='day'?dayView():page==='links'?linksView():page==='backup'?backupView():page==='history'?historyView():taskView(page==='routines'));bindHomeControls();}function item(t,date){const checked=!!t.done[date];return `<div class="item" style="display:block"><div style="display:flex;gap:12px;align-items:center"><input style="flex:0 0 23px" aria-label="Udført: ${esc(t.name)}" type="checkbox" ${checked?'checked':''} onchange="toggle('${t.id}','${date}',this.checked)"><div class="grow"><div class="${checked?'done':''}">${esc(t.name)}</div><div class="tag">${esc(t.time||'Uden klokkeslæt')} · ${t.repeat==='once'?'Engangsopgave':t.repeat==='daily'?'Hver dag':t.repeat==='weekly'?'Hver uge':t.repeat==='every2days'?'Hver anden dag':t.repeat==='every2weeks'?'Hver anden uge':t.repeat==='every2months'?'Hver anden måned':t.repeat==='yearly'?'Hvert år':'Hver måned'}</div></div><button type="button" onclick="removeOccurrence('${t.id}','${date}')">Slet</button></div>${deletePanelFor(t.id,date)}</div>`}function dayView(){const notice=saveNotice?`<div class="card" role="status" style="border-color:#176b58;background:#edf8f1">${esc(saveNotice)}</div>`:'';saveNotice='';const selected=state.tasks.filter(t=>active(t,viewDate)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));const overdue=state.tasks.filter(t=>outstanding(t,viewDate));let done=selected.filter(t=>t.done[viewDate]).length;return `${notice}<div class="home-controls"><button type="button" onclick="toggleHomeSettings()">⚙ Tilpas min startside</button></div>${homeSettingsOpen?homeSettingsView():''}${!state.home.date?`<div class="home-mini-date"><button type="button" onclick="readMyDay()" title="Læs min dag op" aria-label="Læs min dag op">🔊</button><button type="button" onclick="stopReading()" title="Stop oplæsning" aria-label="Stop oplæsning">■</button><span id="speechStatus" class="tag" role="status"></span><strong>${displayDate(viewDate)}</strong> <button onclick="shift(-1)">←</button><button onclick="viewDate=today();render()">I dag</button><button onclick="shift(1)">→</button></div>`:``}<div class="day-top-grid">${state.home.date?`<div data-home-section="date" class="card day-date-card"><h2>Min dag</h2><div class="speech-icons" aria-label="Oplæsning af min dag"><button type="button" class="primary" onclick="readMyDay()" title="Læs min dag op" aria-label="Læs min dag op">🔊</button><button type="button" onclick="stopReading()" title="Stop oplæsning" aria-label="Stop oplæsning">■</button><span id="speechStatus" class="tag" role="status"></span></div><label for="dayDate">Vælg dato</label><div class="date-row"><input id="dayDate" type="text" inputmode="numeric" placeholder="dd-mm-åååå" aria-label="Dato (dag-måned-år)" value="${displayDate(viewDate)}" onchange="changeDayDate(this)" oninput="syncCalendarFromText('dayDate','dayCalendar')" maxlength="10"><label class="calendar-trigger" title="Vælg dato i kalender" aria-label="Vælg dato i kalender">📅<input id="dayCalendar" type="date" lang="da-DK" value="${viewDate}" aria-label="Åbn kalender og vælg dato" onchange="chooseCalendarDate('dayCalendar','dayDate')"></label></div><div class="tag">Datoformat: dd-mm-åååå</div><div class="actions"><button onclick="shift(-1)">← Forrige dag</button><button onclick="viewDate=today();render()">I dag</button><button onclick="shift(1)">Næste dag →</button></div></div>`:``}${state.home.links?`<div data-home-section="links" class="card day-links-card"><h2>Mine links</h2><div class="quick-links">${state.links.length?state.links.map(l=>`<a class="quick-link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">🔗</span><span>${esc(l.name)}</span></a>`).join(''):'<p class="muted">Ingen links endnu. Tilføj dem under Mine links.</p>'}</div></div>`:``}</div>${state.home.activities?`<div data-home-section="activities" class="card"><h2>Aktiviteter ${displayDate(viewDate)}</h2><p class="muted">${done} af ${selected.length} udført</p>${selected.length?selected.map(t=>item(t,viewDate)).join(''):'Ingen aktiviteter denne dag.'}</div>`:``}${state.home.overdue&&overdue.length?`<div data-home-section="overdue" class="card overdue"><h2>Udestående opgaver</h2><p class="muted">Du bestemmer selv, hvad der skal ske med dem.</p>${overdue.map(t=>`<div class="item"><div class="grow">${esc(t.name)}<div class="tag">Planlagt ${displayDate(t.date)}</div></div><button onclick="finishOld('${t.id}')">Udført</button><button onclick="moveOld('${t.id}')">Flyt til i dag</button></div>`).join('')}</div>`:''}<div class="actions"><button class="primary" onclick="tab('tasks');startAdd('once')">+ Ny opgave</button></div>`}function toggleHomeSettings(){homeSettingsOpen=!homeSettingsOpen;render()}
// Bind de fire valg som almindelige kliklyttere efter hver visning.
// Ingen indlejret JavaScript i knappernes HTML.
function bindHomeControls(){
 document.querySelectorAll('[data-home-select]').forEach(select=>{
  select.addEventListener('change',()=>{
   const section=select.getAttribute('data-home-select');
   if(!Object.prototype.hasOwnProperty.call(defaultHome,section))return;
   state.home[section]=select.value==='show';
   const persisted=save();
   render();
   const status=document.getElementById('homeSaveStatus');
   if(status)status.textContent=(state.home[section]?'Viser: ':'Skjuler: ')+
    ({date:'Dato og navigation',links:'Mine links',activities:'Dagens aktiviteter',overdue:'Udestående opgaver'}[section])+

 });

function homeSettingsView(){
 const choices=[['date','Dato og navigation'],['links','Mine links'],['activities','Dagens aktiviteter'],['overdue','Udestående opgaver']];
 return `<div class="card home-settings"><h3>Vælg indhold på startsiden</h3><p class="muted">Vis er standard. Vælg Skjul for at fjerne et område fra startsiden.</p>${choices.map(([key,label])=>`<div class="home-choice"><label for="home_${key}" style="flex:1;margin:0">${label}</label><select id="home_${key}" data-home-select="${key}" style="width:125px;padding:8px"><option value="show" ${state.home[key]?'selected':''}>Vis</option><option value="hide" ${!state.home[key]?'selected':''}>Skjul</option></select></div>`).join('')}<p id="homeSaveStatus" role="status" class="tag"></p><div class="actions"><button type="button" id="homeShowAll">Vis alle områder</button><button type="button" onclick="toggleHomeSettings()">Færdig</button></div></div>`;
}
function chooseCalendarDate(calendarId,textId){const cal=document.getElementById(calendarId),txt=document.getElementById(textId);if(!cal.value)return;txt.value=displayDate(cal.value);if(textId==='dayDate')changeDayDate(txt)}function syncCalendarFromText(textId,calendarId){const iso=parseDate(document.getElementById(textId).value);if(iso)document.getElementById(calendarId).value=iso}function changeDayDate(el){const iso=parseDate(el.value);if(!iso){alert('Skriv en gyldig dato som dd-mm-åååå, f.eks. 19-11-2026.');el.value=displayDate(viewDate);return}viewDate=iso;render()}function shift(n){const d=dt(viewDate);d.setDate(d.getDate()+n);viewDate=localDate(d);page='day';render()}function toggle(id,date,v){const t=state.tasks.find(t=>t.id===id);t.done[date]=v;save();render()}function finishOld(id){const t=state.tasks.find(t=>t.id===id);t.done[t.date]=true;save();render()}function moveOld(id){const t=state.tasks.find(t=>t.id===id);t.date=viewDate;save();render()}function taskView(routines){const list=state.tasks.filter(t=>routines?t.repeat!=='once':t.repeat==='once');return `<div class="card"><h2>${routines?'Mine rutiner':'Mine opgaver'}</h2><p class="muted">${routines?'Opgaver som gentages automatisk':'Opgaver som skal udføres én gang'}</p><button class="primary" onclick="startAdd('${routines?'daily':'once'}')">+ Tilføj ${routines?'rutine':'opgave'}</button> <button type="button" onclick="beginVoiceTask(${routines})" title="Opret med stemmen">🎤 Opret med stemmen</button><p class="tag">Stemmeindtastning kræver mikrofontilladelse og en browser med dansk talegenkendelse.</p></div>${voiceSession?voicePanel():''}${editing?editor():''}<div class="card">${list.length?list.map(t=>`<div class="item"><div class="grow"><strong>${esc(t.name)}</strong><div class="tag">${displayDate(t.date)} · ${esc(t.time||'Uden klokkeslæt')} · ${t.repeat==='once'?'Én gang':t.repeat==='daily'?'Hver dag':t.repeat==='weekly'?'Hver uge':t.repeat==='every2days'?'Hver anden dag':t.repeat==='every2weeks'?'Hver anden uge':t.repeat==='every2months'?'Hver anden måned':t.repeat==='yearly'?'Hvert år':'Hver måned'}</div></div><button onclick="startEdit('${t.id}')">Rediger</button><button onclick="removeFromList('${t.id}')">Slet</button></div>${deletePanelFor(t.id,viewDate)}`).join(''):'Listen er tom.'}</div>`}function startAdd(repeat){cancelVoiceTask();editing={id:null,name:'',date:today(),time:'',repeat};render()}function startEdit(id){cancelVoiceTask();editing={...state.tasks.find(t=>t.id===id)};render()}function editor(){return `<form class="card" novalidate onsubmit="return submitTask(event)"><h3>${editing.id?'Rediger':'Tilføj'} aktivitet</h3><label for="name">Hvad skal du huske?</label><input id="name" required value="${esc(editing.name)}"><label for="date">Dato / startdato</label><div class="date-row"><input type="text" id="date" inputmode="numeric" maxlength="10" placeholder="dd-mm-åååå" pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}" title="Skriv datoen som dd-mm-åååå" required value="${displayDate(editing.date)}" oninput="syncCalendarFromText('date','taskCalendar')"><label class="calendar-trigger" title="Vælg dato i kalender" aria-label="Vælg dato i kalender">📅<input id="taskCalendar" type="date" lang="da-DK" value="${editing.date}" aria-label="Åbn kalender og vælg dato" onchange="chooseCalendarDate('taskCalendar','date')"></label></div><label for="time">Klokkeslæt (valgfrit)</label><input type="time" id="time" value="${esc(editing.time)}"><label for="repeat">Gentagelse</label><select id="repeat"><option value="once" ${editing.repeat==='once'?'selected':''}>Kun én gang</option><option value="daily" ${editing.repeat==='daily'?'selected':''}>Hver dag</option><option value="every2days" ${editing.repeat==='every2days'?'selected':''}>Hver anden dag</option><option value="weekly" ${editing.repeat==='weekly'?'selected':''}>Hver uge</option><option value="every2weeks" ${editing.repeat==='every2weeks'?'selected':''}>Hver anden uge</option><option value="monthly" ${editing.repeat==='monthly'?'selected':''}>Hver måned</option><option value="every2months" ${editing.repeat==='every2months'?'selected':''}>Hver anden måned</option><option value="yearly" ${editing.repeat==='yearly'?'selected':''}>Hvert år</option></select><p id="taskError" role="alert" style="color:#a22;font-weight:600"></p><div class="actions"><button class="primary" type="button" onclick="submitTask()">Gem</button><button type="button" onclick="editing=null;render()">Annuller</button>${editing.id?'<button type="button" onclick="deleteTask()">Slet</button>':''}</div></form>`}function submitTask(e){
 if(e&&e.preventDefault)e.preventDefault();
 const nameEl=document.getElementById('name'),dateEl=document.getElementById('date'),error=document.getElementById('taskError');

 const t={id:editing.id||uid(),name,date,time:document.getElementById('time').value,repeat:document.getElementById('repeat').value,done:editing.id?(state.tasks.find(x=>x.id===editing.id)?.done||{}):{}};
 state.tasks=state.tasks.filter(x=>x.id!==t.id);state.tasks.push(t);

function deleteTask(){if(confirm('Vil du slette denne aktivitet?')){state.tasks=state.tasks.filter(x=>x.id!==editing.id);editing=null;save();render()}}function linksView(){const notice=saveNotice?`<div class="card" role="status" style="border-color:#176b58;background:#edf8f1">${esc(saveNotice)}</div>`:'';saveNotice='';return `${notice}<div class="card"><h2>Mine links</h2><p class="muted">Genveje til hjemmesider og tjenester</p><button type="button" class="primary" onclick="editing={kind:'link',id:null,name:'',url:''};render()">+ Tilføj link</button></div>${editing&&editing.kind==='link'?`<div class="card"><h3>${editing.id?'Rediger link':'Tilføj link'}</h3><label for="linkName">Navn</label><input id="linkName" value="${esc(editing.name)}" placeholder="F.eks. DMI"><label for="linkUrl">Hjemmesideadresse</label><input id="linkUrl" type="text" value="${esc(editing.url)}" placeholder="F.eks. dmi.dk"><p id="linkError" role="alert" style="color:#a32121;font-weight:600"></p><div class="actions"><button type="button" class="primary" onclick="submitLink()">Gem link</button><button type="button" onclick="editing=null;render()">Annuller</button></div></div>`:''}<div class="card">${state.links.length?state.links.map(l=>`<div class="item link-item"><div class="grow"><a class="link-title" target="_blank" rel="noopener noreferrer" href="${esc(l.url)}">${esc(l.name)} ↗</a><div class="link-address">${esc(l.url)}</div></div><div class="link-buttons"><button type="button" onclick="editing={kind:'link',...state.links.find(x=>x.id==='${l.id}')};render()">Rediger</button><button type="button" onclick="deleteLink('${l.id}')">Slet</button></div></div>`).join(''):'Ingen links endnu.'}</div>`}

function backupView(){return `<div class="card"><h2>Bevarelse af dine oplysninger</h2><p id="storageInfo" role="status" style="background:#e4f1ec;padding:12px;border-radius:9px;color:#193047">${esc(initialStorageStatus)}</p><p><strong>Vigtigt:</strong> Data følger automatisk med ved opdatering, når appen åbnes fra samme webadresse og browserlager. Separate forhåndsvisninger i ChatGPT kan have adskilte lagre. Derfor kan automatisk overførsel mellem dem ikke garanteres.</p><h3>Ekstra sikkerhedskopi</h3><p>Gem alle dine opgaver, rutiner, afkrydsninger og links, så du kan tage dem med til næste version.</p><div class="actions"><button type="button" class="primary" onclick="exportBackup()">Hent sikkerhedskopi</button></div><hr style="border:0;border-top:1px solid #d9e3e7;margin:22px 0"><h3>Gendan oplysninger i en ny version</h3><p>Vælg den sikkerhedskopi, du tidligere har hentet. De nuværende oplysninger i denne version bliver erstattet.</p><label for="backupFile">Vælg sikkerhedskopi (.json)</label><input type="file" id="backupFile" accept=".json,application/json" style="max-width:100%"><div class="actions"><button type="button" class="primary" onclick="importBackup()">Gendan sikkerhedskopi</button></div><p id="backupMessage" role="status" style="font-weight:600;color:#193047"></p></div>`}
function exportBackup(){try{const payload={format:'min-personlige-app-backup',version:1,created:new Date().toISOString(),tasks:state.tasks,links:state.links,home:state.home};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Min_Personlige_App_sikkerhedskopi_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);document.getElementById('backupMessage').textContent='Sikkerhedskopien er klar til at blive gemt. Kontrollér mappen Overførsler.'}catch(e){document.getElementById('backupMessage').textContent='Kunne ikke oprette sikkerhedskopi: '+e.message}}
async function importBackup(){const msg=document.getElementById('backupMessage');const file=document.getElementById('backupFile').files[0];if(!file){msg.textContent='Vælg først en sikkerhedskopi.';return}try{const data=JSON.parse(await file.text());if(data.format!=='min-personlige-app-backup'||!Array.isArray(data.tasks)||!Array.isArray(data.links)||!data.tasks.every(t=>t&&typeof t.name==='string'&&typeof t.date==='string'&&typeof t.repeat==='string')||!data.links.every(l=>l&&typeof l.name==='string'&&typeof l.url==='string'))throw Error('Filen er ikke en gyldig sikkerhedskopi fra appen.');if(!confirm('Vil du erstatte de nuværende opgaver, rutiner og links med sikkerhedskopien?'))return;state.tasks=data.tasks.map(t=>({...t,done:t.done&&typeof t.done==='object'?t.done:{},excluded:Array.isArray(t.excluded)?t.excluded:[]}));state.links=data.links;state.home={...defaultHome,...(data.home&&typeof data.home==='object'?data.home:{})};try{save()}catch(e){msg.textContent='Oplysningerne er gendannet i denne visning, men browseren kunne ikke gemme dem permanent.';return}editing=null;pendingDelete=null;page='day';saveNotice='Dine opgaver, rutiner og links er gendannet fra sikkerhedskopien.';render()}catch(e){msg.textContent='Kunne ikke gendanne: '+e.message}}


// Guidet stemmeoprettelse: data gemmes først efter udtrykkelig bekræftelse.
let voiceSession=null, voiceRecognizer=null, voiceSerial=0, voiceListening=false;
const VoiceRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function voicePanel(){
 const v=voiceSession;
 return `<div class="card" style="background:#f4faf7;border-color:#a4c7b7"><h3>🎤 Opret ${v.routines?'rutine':'opgave'} med stemmen</h3><p id="voiceQuestion" style="font-weight:700">${esc(v.question||'Klar')}</p><p id="voiceFeedback" role="status">${esc(v.feedback||'')}</p><div class="actions"><button type="button" class="primary" onclick="voiceListen(true)">🎤 Start lytning / Svar</button><button type="button" onclick="cancelVoiceTask();render()">Annuller</button></div><p class="tag">Tryk på Start lytning / Svar, når du er klar til at tale. Appen forsøger også automatisk at starte mikrofonen. Kontrollér oplysningerne, før du gemmer.</p></div>`;
}
function voiceUpdate(question,feedback){if(!voiceSession)return;voiceSession.question=question;voiceSession.feedback=feedback||'';const q=document.getElementById('voiceQuestion'),f=document.getElementById('voiceFeedback');if(q)q.textContent=question;if(f)f.textContent=feedback||''}
function cancelVoiceTask(){voiceSerial++;voiceListening=false;if(voiceRecognizer){try{voiceRecognizer.abort()}catch(e){}voiceRecognizer=null}if(window.speechSynthesis)window.speechSynthesis.cancel();voiceSession=null}
function beginVoiceTask(routines){
 cancelVoiceTask();editing=null;
 voiceSession={routines,step:0,task:{name:'',date:today(),time:'',repeat:routines?'daily':'once'},question:'',feedback:''};
 render();voiceAsk();
}
function voiceSay(text,then){
 if(!voiceSession)return;
 if(!window.speechSynthesis||typeof SpeechSynthesisUtterance==='undefined'){then();return}
 const u=new SpeechSynthesisUtterance(text);u.lang='da-DK';u.rate=.9;
 const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='da-dk')||voices.find(v=>v.lang.toLowerCase().startsWith('da'))||null;
 const serial=voiceSerial;let completed=false;
 const next=()=>{if(completed)return;completed=true;if(serial===voiceSerial)then()};
 u.onend=next;u.onerror=next;
 window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
}
function voiceAsk(){
 if(!voiceSession)return;
 const v=voiceSession;
 const prompts=['Hvad skal du huske?','Hvilken dato? Du kan for eksempel sige den 25. november, eller i morgen.','Hvad er klokkeslættet? Sig for eksempel klokken 10.30 eller intet klokkeslæt.','Hvor ofte skal rutinen gentages? For eksempel hver dag, hver uge eller hver måned.'];
 if(v.step===4||(!v.routines&&v.step===3)){voiceFinish();return}
 const prompt=prompts[v.step];voiceUpdate(prompt,'Tryk på 🎤 Start lytning / Svar for at tale.');voiceSay(prompt,()=>{if(voiceSession)voiceUpdate(prompt,'Tryk på 🎤 Start lytning / Svar for at tale.');});
}
function voiceListen(manual=false){
 if(!voiceSession||voiceListening)return;
 if(!VoiceRecognition){voiceUpdate(voiceSession.question,'Talegenkendelse understøttes ikke her. Brug almindelig indtastning i stedet.');return}
 if(voiceRecognizer){try{voiceRecognizer.abort()}catch(e){}voiceRecognizer=null}
 voiceListening=true;
 if(window.speechSynthesis)window.speechSynthesis.cancel();
 const r=new VoiceRecognition();voiceRecognizer=r;r.lang='da-DK';r.interimResults=false;r.maxAlternatives=1;
 const serial=voiceSerial;
 voiceUpdate(voiceSession.question,'🎤 Starter mikrofonen …');
 r.onstart=()=>{if(serial===voiceSerial&&voiceSession)voiceUpdate(voiceSession.question,'🎤 Lytter nu … Tal tydeligt.');};
 r.onresult=e=>{if(serial!==voiceSerial||!voiceSession)return;const words=e.results[0][0].transcript.trim();voiceRecognizer=null;voiceListening=false;voiceAccept(words)};
 r.onerror=e=>{if(serial!==voiceSerial||!voiceSession)return;voiceRecognizer=null;voiceListening=false;voiceUpdate(voiceSession.question,e.error==='not-allowed'?'Mikrofonen blev afvist. Hvis Edge spørger, vælg Allow. Tryk derefter Svar igen. Lokale filer kan kræve tilladelse flere gange.':'Kunne ikke høre svaret ('+e.error+'). Tryk på Svar igen.')};
 r.onnomatch=()=>{voiceListening=false;if(serial===voiceSerial)voiceUpdate(voiceSession.question,'Jeg opfattede ikke svaret. Tryk på Svar igen.')};
 try{r.start()}catch(e){voiceListening=false;voiceUpdate(voiceSession.question,'Kunne ikke starte mikrofonen. Prøv igen eller brug tastaturet.')}
}
function voiceDate(text){
 const raw=text.toLowerCase().replace(/[.,]/g,' ').replace(/\s+/g,' ').trim();
 if(/i morgen/.test(raw)){const d=new Date();d.setDate(d.getDate()+1);return localDate(d)}
 if(/i dag/.test(raw))return today();
 const numeric=raw.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/);
 if(numeric){let y=numeric[3]?Number(numeric[3]):new Date().getFullYear();if(y<100)y+=2000;const d=new Date(y,Number(numeric[2])-1,Number(numeric[1]));if(d.getDate()===Number(numeric[1])&&d.getMonth()+1===Number(numeric[2]))return localDate(d)}
 const months=['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
 const match=raw.match(/\b(\d{1,2})\s+(januar|februar|marts|april|maj|juni|juli|august|september|oktober|november|december)(?:\s+(\d{4}))?/);
 if(match){let y=match[3]?Number(match[3]):new Date().getFullYear();let d=new Date(y,months.indexOf(match[2]),Number(match[1]));if(!match[3]&&localDate(d)<today())d.setFullYear(y+1);if(d.getDate()===Number(match[1]))return localDate(d)}
 return null;
}
function voiceTime(text){
 const t=text.toLowerCase();if(/ingen|intet|uden|nej/.test(t))return '';
 const m=t.match(/(?:klokken|kl\.?\s*)?\s*(\d{1,2})(?:[:., ](\d{2}))?/);
 if(!m)return null;const h=Number(m[1]),min=m[2]?Number(m[2]):0;
 if(h>23||min>59)return null;return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
}
function voiceRepeat(text){const t=text.toLowerCase();if(/hver anden måned|hver 2 måned/.test(t))return 'every2months';if(/hver anden uge|hver 2 uge/.test(t))return 'every2weeks';if(/hver anden dag|hver 2 dag/.test(t))return 'every2days';if(/hver dag|dagligt|daglig/.test(t))return 'daily';if(/hver uge|ugentlig/.test(t))return 'weekly';if(/hver måned|månedligt/.test(t))return 'monthly';if(/hvert år|årligt|årlig/.test(t))return 'yearly';return null}
function voiceAccept(words){
 const v=voiceSession;if(!v)return;
 if(v.step===0){if(!words){voiceUpdate(v.question,'Jeg hørte ikke et navn. Prøv igen.');return}v.task.name=words}
 if(v.step===1){const date=voiceDate(words);if(!date){voiceUpdate(v.question,'Jeg hørte: '+words+'. Datoen blev ikke forstået. Tryk på Svar igen.');return}v.task.date=date}
 if(v.step===2){const time=voiceTime(words);if(time===null){voiceUpdate(v.question,'Jeg hørte: '+words+'. Prøv igen, for eksempel klokken 10.30.');return}v.task.time=time}
 if(v.step===3){const repeat=voiceRepeat(words);if(!repeat){voiceUpdate(v.question,'Jeg hørte: '+words+'. Prøv for eksempel hver dag eller hver uge.');return}v.task.repeat=repeat}
 v.step++;voiceAsk();
}
function voiceFinish(){
 if(!voiceSession)return;
 const v=voiceSession, t=v.task;
 const repeatNames={daily:'hver dag',every2days:'hver anden dag',weekly:'hver uge',every2weeks:'hver anden uge',monthly:'hver måned',every2months:'hver anden måned',yearly:'hvert år'};
 const summary=t.name+', den '+displayDate(t.date)+(t.time?', klokken '+t.time:' uden klokkeslæt')+(v.routines?', '+repeatNames[t.repeat]:'');
 voiceUpdate('Kontrollér oplysningerne: '+summary,'Brug Gem i formularen nedenfor, når alt er korrekt. Du kan rette felterne først.');
 editing={id:null,...t};
 const el=document.getElementById('main');if(el){const form=document.createElement('div');form.innerHTML=editor();el.querySelector('.card:last-child')?.before(form)}
 voiceSay('Jeg har udfyldt oplysningerne. Kontrollér dem på skærmen og tryk Gem, hvis de er korrekte.',()=>{});
}

let currentSpeech=null;
function stopReading(){
 if('speechSynthesis' in window){window.speechSynthesis.cancel()}
 currentSpeech=null;
 const status=document.getElementById('speechStatus');
 if(status)status.textContent='Oplæsning stoppet.';
}
function readMyDay(){
 const status=document.getElementById('speechStatus');
 if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
  if(status)status.textContent='Denne browser understøtter ikke oplæsning.';
  return;
 }
 window.speechSynthesis.cancel();
 const dateLabel=new Intl.DateTimeFormat('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(dt(viewDate));
 const activities=state.tasks.filter(t=>active(t,viewDate)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
 const overdue=state.tasks.filter(t=>outstanding(t,viewDate));
 const lines=['Her er din dag, '+dateLabel+'.'];
 if(activities.length===0){lines.push('Du har ingen planlagte aktiviteter denne dag.')}else{
  lines.push('Du har '+activities.length+' aktiviteter.');
  for(const task of activities){
   const clock=task.time?' klokken '+task.time.replace(':','.') : '';
   lines.push(task.name+clock+(task.done&&task.done[viewDate]?', udført.':'.'));
  }
 }
 if(overdue.length){lines.push('Du har '+overdue.length+' udestående opgaver.');for(const task of overdue)lines.push(task.name+'.')}
 else{lines.push('Du har ingen udestående opgaver.')}
 const utterance=new SpeechSynthesisUtterance(lines.join(' '));
 utterance.lang='da-DK';utterance.rate=0.9;utterance.pitch=1;
 const voices=window.speechSynthesis.getVoices();
 const danish=voices.find(v=>v.lang.toLowerCase()==='da-dk')||voices.find(v=>v.lang.toLowerCase().startsWith('da'));
 if(danish)utterance.voice=danish;
 currentSpeech=utterance;
 utterance.onend=()=>{if(currentSpeech===utterance){currentSpeech=null;const el=document.getElementById('speechStatus');if(el)el.textContent='Oplæsningen er færdig.'}};
 utterance.onerror=e=>{if(currentSpeech===utterance){currentSpeech=null;const el=document.getElementById('speechStatus');if(el)el.textContent=e.error==='canceled'?'Oplæsning stoppet.':'Oplæsningen kunne ikke gennemføres. Kontrollér browserens lyd og danske stemme.'}};
 if(status)status.textContent='Oplæsning af '+displayDate(viewDate)+' er startet.';
 window.speechSynthesis.speak(utterance);
}
